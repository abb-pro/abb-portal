<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample File Download</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #121722;
      color: #edf2f7;
      font-family: Arial, Helvetica, sans-serif;
    }

    .download-card {
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      border: 1px solid #2b3546;
      border-radius: 14px;
      background: #1c2432;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    .card-header {
      padding: 22px 24px;
      background: #1769d2;
      color: #ffffff;
      text-align: center;
    }

    .card-header h1 {
      margin: 0;
      font-size: 1.45rem;
    }

    .card-content {
      padding: 28px 24px;
      text-align: center;
    }

    .card-content p {
      margin: 0 0 22px;
      color: #c2ccda;
      line-height: 1.6;
    }

    .download-button {
      display: inline-block;
      border: 0;
      border-radius: 8px;
      padding: 13px 22px;
      background: #22a447;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .download-button:hover {
      background: #198638;
      transform: translateY(-1px);
    }

    .download-button:focus-visible {
      outline: 3px solid #a7f3b8;
      outline-offset: 3px;
    }

    .status {
      min-height: 1.4em;
      margin-top: 16px;
      color: #9ee6b0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="download-card">
    <header class="card-header">
      <h1>Sample Download</h1>
    </header>

    <section class="card-content">
      <p>Click the button below to download a sample text file to your device.</p>
      <button class="download-button" id="downloadButton" type="button">
        Download Sample .txt
      </button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const downloadButton = document.getElementById("downloadButton");
    const status = document.getElementById("status");

    downloadButton.addEventListener("click", () => {
      const sampleText = [
        "Hello!",
        "",
        "This is a sample text file downloaded from the HTML page.",
        "You can edit this sample text in the page's JavaScript."
      ].join("\n");

      const file = new Blob([sampleText], { type: "text/plain;charset=utf-8" });
      const fileUrl = URL.createObjectURL(file);
      const link = document.createElement("a");

      link.href = fileUrl;
      link.download = "sample.txt";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(fileUrl), 1000);
      status.textContent = "Your sample.txt download has started.";
    });
  </script>
</body>
</html>
